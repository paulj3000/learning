# Local development only. Never used for deployed environments.
# Nothing in the repository connects to this database yet (the Django project arrives in LAI-0204).
services:
  db:
    # PostgreSQL 18 is the required version for development and tests (owner decision 2026-11-21).
    # The 18 image keeps its data under /var/lib/postgresql/18/docker, so the volume mounts at
    # /var/lib/postgresql. The volume is new: PostgreSQL 18 cannot open the old 16 volume
    # (`lai_pgdata`), which is left in place and never deleted by the project.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lai}
      POSTGRES_USER: ${POSTGRES_USER:-lai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-password}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - lai_pg18data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lai_pg18data:
