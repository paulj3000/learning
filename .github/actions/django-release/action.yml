# One environment's release step for .github/workflows/deploy-django-ec2.yml (ADR-037). The calling
# job owns the GitHub Environment (django-dev / django-prod), whose OIDC subject is the only one the
# environment's deploy role trusts. Needs the repository checked out at the commit being released.
name: Django EC2 release
description: Assume the environment's deploy role, release one image through SSM, check readiness.

inputs:
  target:
    description: dev or prod
    required: true
  image:
    description: ECR image pinned by digest
    required: true
  git-sha:
    description: Full commit SHA of the image
    required: true
  commit-epoch:
    description: Commit time in unix seconds (the release ordering key)
    required: true
  role-arn:
    description: The environment's deploy role (vars.LAI_DEPLOY_ROLE_ARN)
    required: true
  aws-region:
    description: AWS region
    required: true
  base-url:
    description: Public API base URL for the readiness check through the ALB (optional)
    required: false
    default: ''
  allow-older:
    description: "'true' to allow a commit older than the running release"
    required: false
    default: 'false'
  allow-destructive-migrations:
    description: "'true' to allow destructive migrations"
    required: false
    default: 'false'
  check-superseded:
    description: "'true' to skip when a newer backend commit is already on main (push runs)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Skip when a newer backend commit is already on main
      id: superseded
      shell: bash
      env:
        CHECK: ${{ inputs.check-superseded }}
        GIT_SHA: ${{ inputs.git-sha }}
      run: |
        echo "skip=false" >>"$GITHUB_OUTPUT"
        if [ "$CHECK" != true ]; then exit 0; fi
        tip=$(git ls-remote origin refs/heads/main | cut -f1)
        if [ -z "$tip" ] || [ "$tip" = "$GIT_SHA" ]; then exit 0; fi
        git fetch --quiet --depth=200 origin main || exit 0
        changed=$(git diff --name-only "$GIT_SHA" "$tip" -- lai content react/public/models \
          requirements.txt pyproject.toml scripts/aws deploy/ec2 2>/dev/null || true)
        if [ -n "$changed" ]; then
          echo "skip=true" >>"$GITHUB_OUTPUT"
          echo "::notice::main moved to $tip with backend changes; that run deploys instead"
        fi

    - uses: aws-actions/configure-aws-credentials@v4
      if: steps.superseded.outputs.skip != 'true'
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: lai-deploy-${{ inputs.target }}-${{ github.run_id }}

    - name: Release through SSM
      if: steps.superseded.outputs.skip != 'true'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        IMAGE: ${{ inputs.image }}
        GIT_SHA: ${{ inputs.git-sha }}
        EPOCH: ${{ inputs.commit-epoch }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ALLOW_OLDER: ${{ inputs.allow-older }}
        ALLOW_DESTRUCTIVE: ${{ inputs.allow-destructive-migrations }}
      run: |
        flags=()
        if [ "$ALLOW_OLDER" = true ]; then flags+=(--allow-older); fi
        if [ "$ALLOW_DESTRUCTIVE" = true ]; then flags+=(--allow-destructive-migrations); fi
        scripts/aws/ssm-run.sh "$TARGET" deploy --image "$IMAGE" --git-sha "$GIT_SHA" \
          --commit-epoch "$EPOCH" --run-url "$RUN_URL" "${flags[@]}"

    - name: Public readiness check through the load balancer
      if: steps.superseded.outputs.skip != 'true' && inputs.base-url != ''
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
      run: |
        for attempt in $(seq 1 10); do
          if body=$(curl -fsS --max-time 10 "$BASE_URL/api/v1/health/ready/") &&
            [ "$(jq -r .status <<<"$body")" = ok ]; then
            echo "ready through $BASE_URL (attempt $attempt)"
            exit 0
          fi
          sleep 6
        done
        echo "::error::$BASE_URL/api/v1/health/ready/ is not ready, although the instance check passed: check the ALB, DNS and certificate"
        exit 1
