# One environment's React site release for .github/workflows/deploy-site.yml (LAI-INFRA-004,
# docs/infrastructure/deployment-design.md). The calling job owns the GitHub Environment
# (site-dev / site-prod), whose OIDC subject is the only one the site deploy role trusts. Needs
# the repository checked out at the commit being released.
name: React site release
description: Build the site against the Cognito user pool and Django, publish it to S3, invalidate, smoke test.

inputs:
  target:
    description: dev or prod
    required: true
  git-sha:
    description: Full commit SHA being released
    required: true
  role-arn:
    description: The environment's site deploy role (vars.LAI_SITE_DEPLOY_ROLE_ARN)
    required: true
  cognito-user-pool-id:
    description: The parent user pool (vars.LAI_COGNITO_USER_POOL_ID), e.g. us-west-1_AbC123
    required: true
  cognito-client-id:
    description: The pool's public web app client (vars.LAI_COGNITO_CLIENT_ID); never a secret client
    required: true
  bucket:
    description: LaiFrontend-<env> output WebBucketName
    required: true
  distribution-id:
    description: LaiFrontend-<env> output DistributionId
    required: true
  site-url:
    description: https:// origin of the site, for the smoke test
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install
      shell: bash
      run: npm ci --no-audit --no-fund

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1
        role-session-name: lai-site-${{ inputs.target }}-${{ github.run_id }}

    # The pool and client are public identifiers (AMP-02, react/src/lib/cognito/config.ts); a
    # build without them would ship a site nobody can sign in to, so refuse it.
    - name: Build (Cognito sign-in, Django backend on same-origin /api/)
      shell: bash
      env:
        VITE_DJANGO_API_BASE: ''
        VITE_COGNITO_USER_POOL_ID: ${{ inputs.cognito-user-pool-id }}
        VITE_COGNITO_CLIENT_ID: ${{ inputs.cognito-client-id }}
      run: |
        [[ "$VITE_COGNITO_USER_POOL_ID" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]_[A-Za-z0-9]+$ ]] || { echo "bad cognito-user-pool-id"; exit 1; }
        [[ "$VITE_COGNITO_CLIENT_ID" =~ ^[a-z0-9]{1,128}$ ]] || { echo "bad cognito-client-id"; exit 1; }
        npm run build

    - name: Publish to S3 and invalidate the shells
      shell: bash
      env:
        AWS_REGION: us-east-1
        BUCKET: ${{ inputs.bucket }}
        DISTRIBUTION: ${{ inputs.distribution-id }}
        GIT_SHA: ${{ inputs.git-sha }}
      run: scripts/aws/publish-site.sh publish react/dist "$BUCKET" "$DISTRIBUTION" "$GIT_SHA"

    - name: Smoke test (shell and /api/ through CloudFront)
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
      run: |
        curl -fsS --max-time 20 "$SITE_URL/" | grep -q 'id="root"'
        curl -fsS --max-time 20 "$SITE_URL/children/smoke-test" | grep -q 'id="root"'
        curl -fsS --max-time 20 -o /dev/null "$SITE_URL/api/v1/health/"
        echo "site and /api/ answer at $SITE_URL"
