# DEV Lambda workers (lai-dev-jobs-ai, lai-dev-jobs-media; LaiDevPlatform-dev).
#
#   push to main (worker paths) -> tests/lambda -> package (scripts/aws/package-lambda.sh)
#     -> upload lambda/jobs-worker-<hash16>.zip to the artifacts bucket -> update both functions
#
# The functions run outside the VPC and do not need the EC2 instance, so this works while the
# environment is stopped. OIDC only: the backend role (vars.LAI_DEV_BACKEND_ROLE_ARN) trusts the
# dev-backend environment. Nothing runs until LAI_DEV_NATIVE_ENABLED is 'true'.
#
# The stack's WorkerCodeKey parameter still names the package of the last deploy-debug.sh run;
# the next deploy-debug.sh run packages the same sources to the same content-addressed key.
name: Deploy DEV Lambda workers

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
      - 'lai/apps/ai/providers/**'
      - 'lai/apps/jobs/core/**'
      - 'processing/lai_processing/**'
      - 'scripts/aws/package-lambda.sh'
      - 'tests/lambda/**'
      - '.github/workflows/deploy-dev-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.LAI_AWS_REGION || 'us-west-1' }}

jobs:
  test:
    name: Lambda worker tests
    if: vars.LAI_DEV_NATIVE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: make py-install

      - name: Pytest tests/lambda
        run: .venv/bin/python -m pytest -q tests/lambda

  deploy:
    name: Update the DEV workers
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev-backend
    concurrency:
      group: deploy-dev-lambda
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LAI_DEV_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lai-dev-lambda-${{ github.run_id }}

      - name: Package, upload and update both functions
        env:
          LAI_DEV_ARTIFACT_BUCKET: ${{ vars.LAI_DEV_ARTIFACT_BUCKET }}
        run: scripts/aws/dev-release.sh lambda-deploy
