name: AWS EC2 Smoke Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Prevent concurrent runs of this workflow in this repository.
# Multi-repository access to the same EC2 instance requires an AWS-side lock.
concurrency:
  group: lai-ec2-ci
  cancel-in-progress: false

jobs:
  ec2-test:
    name: Verify AWS OIDC and run EC2 smoke test
    runs-on: ubuntu-24.04
    environment: lai-ci
    timeout-minutes: 30

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.LAI_CI_INSTANCE_ID }}

    steps:
      - name: Validate configuration
        shell: bash
        env:
          ROLE_ARN: ${{ vars.LAI_CI_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo 'Missing AWS_REGION variable'; exit 1; }
          test -n "$INSTANCE_ID" || { echo 'Missing LAI_CI_INSTANCE_ID variable'; exit 1; }
          test -n "$ROLE_ARN" || { echo 'Missing LAI_CI_ROLE_ARN variable'; exit 1; }
          echo "Region: $AWS_REGION"
          echo "EC2 instance: $INSTANCE_ID"

      # Diagnostic output excludes the OIDC JWT and its signature.
      - name: Show GitHub OIDC identity claims
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          separator = '&' if '?' in url else '?'
          url += separator + urllib.parse.urlencode({'audience': 'sts.amazonaws.com'})
          request = urllib.request.Request(
              url,
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ('sub', 'aud', 'repository', 'repository_owner',
                      'repository_owner_id', 'repository_id'):
              print(f'{key}: {claims.get(key)}')
          PY

      - name: Configure AWS credentials
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.LAI_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Start EC2
        id: start
        shell: bash
        run: |
          set -euo pipefail
          aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

      - name: Wait for SSM
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(aws ssm describe-instance-information \
