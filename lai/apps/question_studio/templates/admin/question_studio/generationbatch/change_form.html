{% extends "admin/change_form.html" %}
{% block object-tools %}{{ block.super }}
{% if studio_can_cancel or studio_can_retry %}
<div class="studio-batch-controls" role="group" aria-label="Batch controls">
  {% if studio_can_cancel %}
  <form method="post" action="{{ studio_cancel_url }}" style="display:inline">
    {% csrf_token %}
    <button type="submit" class="button">Cancel this batch</button>
  </form>
  {% endif %}
  {% if studio_can_retry %}
  <form method="post" action="{{ studio_retry_url }}" style="display:inline">
    {% csrf_token %}
    <button type="submit" class="button default">Retry missing questions</button>
  </form>
  {% endif %}
</div>
{% endif %}
{% endblock %}
