{% extends "admin/base_site.html" %}
{% block content %}
<p>Start a draft of <strong>{{ kind.name }} {{ record }}</strong> from its published version.</p>
<p>A draft changes nothing a child sees until it is published. If you already have an open draft of this record, it is reopened instead.</p>
<form method="post">{% csrf_token %}
  <input type="submit" class="default" value="Start the draft">
</form>
{% endblock %}
